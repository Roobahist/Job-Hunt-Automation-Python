model_list:
  # Add one deployment entry per API key. Deployments sharing model_name form one
  # logical pool, so LiteLLM can load-balance and cool down individual credentials.
  - model_name: groq-gpt-oss
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY_1

  - model_name: groq-gpt-oss
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY_2

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY_1

  - model_name: gemini-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY_1

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 0
  allowed_fails: 1
  cooldown_time: 65

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
