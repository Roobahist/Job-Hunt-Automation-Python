services:
  api:
    image: job-hunt-automation-api:latest
    build:
      context: .
      target: api
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - artifacts:/app/runs
      - ./config:/app/config:ro
      - ./tenants:/app/tenants:ro
    depends_on: {redis: {condition: service_healthy}}
    restart: unless-stopped

  test:
    image: job-hunt-automation-api:latest
    env_file: .env
    command: uv run --frozen --extra dev pytest -q
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./config:/app/config:ro
      - ./tenants:/app/tenants:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
    depends_on: {redis: {condition: service_healthy}}
    profiles: ["tools"]
    restart: "no"

  worker-fast:
    image: job-hunt-automation-worker:latest
    build:
      context: .
      target: worker
    env_file: .env
    command: >-
      celery -A job_hunt.worker.celery_app worker
      --loglevel=INFO -Q fast --hostname=fast@%h
      --concurrency=${FAST_WORKER_CONCURRENCY:-3}
    volumes:
      - artifacts:/app/runs
      - ./config:/app/config:ro
      - ./tenants:/app/tenants:ro
    depends_on: {redis: {condition: service_healthy}}
    restart: unless-stopped

  worker-documents:
    image: job-hunt-automation-worker:latest
    env_file: .env
    command: >-
      celery -A job_hunt.worker.celery_app worker
      --loglevel=INFO -Q documents --hostname=documents@%h
      --concurrency=${DOCUMENT_WORKER_CONCURRENCY:-1}
    volumes:
      - artifacts:/app/runs
      - ./config:/app/config:ro
      - ./tenants:/app/tenants:ro
    depends_on: {redis: {condition: service_healthy}}
    restart: unless-stopped

  worker-notifications:
    image: job-hunt-automation-worker:latest
    env_file: .env
    command: >-
      celery -A job_hunt.worker.celery_app worker
      --loglevel=INFO -Q notifications --hostname=notifications@%h
      --concurrency=${NOTIFICATION_WORKER_CONCURRENCY:-1}
    volumes:
      - artifacts:/app/runs
      - ./config:/app/config:ro
      - ./tenants:/app/tenants:ro
    depends_on: {redis: {condition: service_healthy}}
    restart: unless-stopped

  beat:
    image: job-hunt-automation-api:latest
    env_file: .env
    command: celery -A job_hunt.worker.celery_app beat --loglevel=INFO
    volumes:
      - ./config:/app/config:ro
      - ./tenants:/app/tenants:ro
    depends_on: {redis: {condition: service_healthy}}
    restart: unless-stopped

  flower:
    image: job-hunt-automation-api:latest
    env_file: .env
    command: >-
      sh -c 'celery -A job_hunt.worker.celery_app flower --port=5555
      $${FLOWER_BASIC_AUTH:+--basic-auth=$${FLOWER_BASIC_AUTH}}'
    ports: ["127.0.0.1:5555:5555"]
    volumes:
      - ./config:/app/config:ro
      - ./tenants:/app/tenants:ro
    depends_on: {redis: {condition: service_healthy}}
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  artifacts:
  redis-data:
