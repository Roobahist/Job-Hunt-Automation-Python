services:
  api:
    build:
      context: .
      target: api
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["artifacts:/app/runs"]
    depends_on: {redis: {condition: service_healthy}}
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    env_file: .env
    volumes: ["artifacts:/app/runs"]
    depends_on: {redis: {condition: service_healthy}}
    restart: unless-stopped

  beat:
    build:
      context: .
      target: beat
    env_file: .env
    depends_on: {redis: {condition: service_healthy}}
    restart: unless-stopped

  flower:
    build:
      context: .
      target: api
    env_file: .env
    command: >-
      sh -c 'celery -A job_hunt.worker.celery_app flower --port=5555
      $${FLOWER_BASIC_AUTH:+--basic-auth=$${FLOWER_BASIC_AUTH}}'
    ports: ["127.0.0.1:5555:5555"]
    depends_on: {redis: {condition: service_healthy}}
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  artifacts:
  redis-data:
