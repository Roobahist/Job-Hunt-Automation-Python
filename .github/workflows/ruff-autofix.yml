name: Ruff Autofix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message || '', '[ruff-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Mark intentional shared fallback state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/job_hunt/integrations/gemini_pool.py")
          text = path.read_text()
          text = text.replace("from typing import Any\n", "from typing import Any, ClassVar\n")
          text = text.replace("    _lock = Lock()\n", "    _lock: ClassVar[Lock] = Lock()\n")
          text = text.replace(
              "    _unavailable_until: dict[str, float] = {}\n",
              "    _unavailable_until: ClassVar[dict[str, float]] = {}\n",
          )
          text = text.replace(
              "    _invalid_key_until: dict[str, float] = {}\n",
              "    _invalid_key_until: ClassVar[dict[str, float]] = {}\n",
          )
          path.write_text(text)
          PY
      - name: Apply Ruff fixes
        run: |
          uv run ruff check . --fix
          uv run ruff format .
          uv run ruff check .
          uv run ruff format --check .
      - name: Commit normalized source
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize Python style [ruff-autofix]"
          git push
