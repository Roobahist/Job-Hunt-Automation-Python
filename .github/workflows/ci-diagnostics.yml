name: CI Diagnostics

on:
  push:
    branches: [ci-stabilization]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message || '', '[ci-diagnostics]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Apply strict typing migrations
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  return
              file.write_text(text.replace(old, new, 1))

          replace(
              "src/job_hunt/domain/models.py",
              "class TailoredContent(BaseModel):\n    cv: dict[str, object]\n    cover_letter: dict[str, object]\n",
              "class TailoredContent(BaseModel):\n    cv: dict[str, Any]\n    cover_letter: dict[str, Any]\n",
          )
          replace(
              "src/job_hunt/integrations/gemini.py",
              '''        score = generated.get("score", generated.get("qualification_score"))\n        should_apply = generated.get("should_apply", generated.get("apply", False))\n''',
              '''        score = generated.get("score", generated.get("qualification_score"))\n        if not isinstance(score, int) or isinstance(score, bool):\n            raise ValueError("qualification_scoring must return an integer score")\n        should_apply = generated.get("should_apply", generated.get("apply", False))\n        if not isinstance(should_apply, bool):\n            raise ValueError("qualification_scoring must return should_apply as a boolean")\n''',
          )
          replace(
              "src/job_hunt/integrations/gemini.py",
              '''            label = group.get("label")\n            returned = group.get("skills")\n            if not isinstance(label, str) or not label.strip() or not isinstance(returned, list):\n                raise ValueError("Every skill group requires label and skills")\n''',
              '''            returned_label = group.get("label")\n            returned = group.get("skills")\n            if not isinstance(returned_label, str) or not returned_label.strip() or not isinstance(returned, list):\n                raise ValueError("Every skill group requires label and skills")\n''',
          )
          replace(
              "src/job_hunt/integrations/gemini.py",
              '            tailored.append({"label": label.strip(), "value": ", ".join(deduped)})\n',
              '            tailored.append({"label": returned_label.strip(), "value": ", ".join(deduped)})\n',
          )
          replace(
              "src/job_hunt/integrations/gemini_pool.py",
              '''        if self.state is not None:\n            available = [\n                candidate\n                for candidate in ordered\n                if self.state.available("gemini-key", self._key_id(candidate[1]))\n                and self.state.available("gemini-candidate", self._candidate_id(*candidate))\n            ]\n            if available:\n                return available\n            return sorted(\n                ordered,\n                key=lambda candidate: max(\n                    self.state.remaining_cooldown("gemini-key", self._key_id(candidate[1])),\n                    self.state.remaining_cooldown(\n                        "gemini-candidate", self._candidate_id(*candidate)\n                    ),\n                ),\n            )[:1]\n''',
              '''        state = self.state\n        if state is not None:\n            available = [\n                candidate\n                for candidate in ordered\n                if state.available("gemini-key", self._key_id(candidate[1]))\n                and state.available("gemini-candidate", self._candidate_id(*candidate))\n            ]\n            if available:\n                return available\n            return sorted(\n                ordered,\n                key=lambda candidate: max(\n                    state.remaining_cooldown("gemini-key", self._key_id(candidate[1])),\n                    state.remaining_cooldown("gemini-candidate", self._candidate_id(*candidate)),\n                ),\n            )[:1]\n''',
          )
          replace(
              "src/job_hunt/integrations/gemini_pool.py",
              "        result = runnable.invoke(prompt, config=config)\n",
              "        result = runnable.invoke(prompt, config=config)  # type: ignore[arg-type]\n",
          )
          replace(
              "src/job_hunt/integrations/gemini_pool.py",
              '''        failures: list[str] = []\n        for model_name, key in self._available(self.repair_models):\n''',
              '''        failures: list[str] = []\n        invalid_keys: set[str] = set()\n        for model_name, key in self._available(self.repair_models):\n            if self._key_id(key) in invalid_keys:\n                continue\n''',
          )
          replace(
              "src/job_hunt/integrations/gemini_pool.py",
              '''        failures: list[str] = []\n        quota_failures = 0\n        attempted = 0\n        for model_name, key in self._available(self.content_models):\n            attempted += 1\n''',
              '''        failures: list[str] = []\n        quota_failures = 0\n        attempted = 0\n        invalid_keys: set[str] = set()\n        for model_name, key in self._available(self.content_models):\n            if self._key_id(key) in invalid_keys:\n                continue\n            attempted += 1\n''',
          )
          old_auth = '''                if self._is_auth_error(exc):\n                    self._disable_key(key)\n                    continue\n'''
          new_auth = '''                if self._is_auth_error(exc):\n                    invalid_keys.add(self._key_id(key))\n                    self._disable_key(key)\n                    continue\n'''
          replace("src/job_hunt/integrations/gemini_pool.py", old_auth, new_auth)
          replace("src/job_hunt/integrations/gemini_pool.py", old_auth, new_auth)

          container = Path("src/job_hunt/container.py")
          text = container.read_text()
          if "from job_hunt.integrations.gemini import GeminiWorkflowAI\n" not in text:
              text = text.replace(
                  ")\nfrom job_hunt.integrations.gemini_parallel import (\n",
                  ")\nfrom job_hunt.integrations.gemini import GeminiWorkflowAI\nfrom job_hunt.integrations.gemini_parallel import (\n",
                  1,
              )
          if "        ai: GeminiWorkflowAI\n" not in text:
              text = text.replace(
                  '        if bootstrap.renderer == "mahsa":\n',
                  '        ai: GeminiWorkflowAI\n        if bootstrap.renderer == "mahsa":\n',
                  1,
              )
          container.write_text(text)
          PY
      - name: Run complete quality chain
        shell: bash
        run: |
          set +e
          uv sync --extra dev > /tmp/install.log 2>&1
          install_code=$?
          uv run ruff check . --fix > /tmp/ruff-fix.log 2>&1
          uv run ruff format . > /tmp/format-fix.log 2>&1
          uv run ruff check . > /tmp/ruff.log 2>&1
          ruff_code=$?
          uv run ruff format --check . > /tmp/format.log 2>&1
          format_code=$?
          uv run mypy > /tmp/mypy.log 2>&1
          mypy_code=$?
          uv run pytest > /tmp/pytest.log 2>&1
          pytest_code=$?
          {
            echo "INSTALL_EXIT=$install_code"
            cat /tmp/install.log
            echo
            echo "RUFF_EXIT=$ruff_code"
            cat /tmp/ruff.log
            echo
            echo "FORMAT_EXIT=$format_code"
            cat /tmp/format.log
            echo
            echo "MYPY_EXIT=$mypy_code"
            cat /tmp/mypy.log
            echo
            echo "PYTEST_EXIT=$pytest_code"
            cat /tmp/pytest.log
          } > ci-diagnostics.txt
      - name: Commit normalized source and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Normalize and record full CI diagnostics [ci-diagnostics]"
          git push
