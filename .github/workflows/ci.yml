name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --target api -t job-hunt-api .
      - name: Generate LiteLLM smoke config
        run: >-
          docker run --rm
          -v "$PWD:/app" -w /app
          -e GROQ_API_KEY_1=dummy-groq-key
          -e LITELLM_MASTER_KEY=sk-ci-litellm
          -e LITELLM_GROQ_DISCOVER_MODELS=false
          -e LITELLM_GROQ_FAST_MODELS=llama-3.1-8b-instant
          -e LITELLM_GROQ_BALANCED_MODELS=openai/gpt-oss-20b
          -e LITELLM_GROQ_POWERFUL_MODELS=openai/gpt-oss-120b
          job-hunt-api python scripts/generate-litellm-config.py
      - name: Start LiteLLM proxy from generated config
        run: |
          docker run -d --name litellm-smoke -p 4000:4000 \
            -v "$PWD/config/litellm.runtime.yaml:/app/config.yaml:ro" \
            -e GROQ_API_KEY_1=dummy-groq-key \
            -e LITELLM_MASTER_KEY=sk-ci-litellm \
            ghcr.io/berriai/litellm:main-stable \
            --config /app/config.yaml --port 4000
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4000/health/liveliness >/dev/null; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              docker logs litellm-smoke
              exit 1
            fi
            sleep 1
          done
          curl -fsS -H 'Authorization: Bearer sk-ci-litellm' http://127.0.0.1:4000/v1/models > /tmp/models.json
          grep -q 'job-fast' /tmp/models.json
          grep -q 'job-balanced' /tmp/models.json
          grep -q 'job-powerful' /tmp/models.json
          docker rm -f litellm-smoke
      - name: Build worker image
        run: docker build --target worker -t job-hunt-worker .
      - name: Compile Mahsa CV with real pdflatex
        run: docker run --rm job-hunt-worker python scripts/check-mahsa-latex.py
      - name: Build Beat image
        run: docker build --target beat -t job-hunt-beat .
